name: Central D-Track Pipeline

on:
  workflow_call:
    secrets:
      DTRACK_API_KEY:
        required: true

jobs:
  sbom-scan:
    name: Generate SBOM & Upload to Dependency-Track
    runs-on: [self-hosted]

    steps:
      - name: Checkout du dépôt appelant
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer cdxgen
        shell: powershell
        run: |
          npm install -g @cyclonedx/cdxgen

      - name: Déterminer les informations du projet
        id: project
        shell: powershell
        run: |
          $projectName = $env:GITHUB_REPOSITORY.Split("/")[1]
          $projectVersion = "1.0.0"

          if (Test-Path "./package.json") {
            try {
              $pkg = Get-Content -Raw -Path "./package.json" | ConvertFrom-Json
              if (-not [string]::IsNullOrWhiteSpace($pkg.version)) {
                $projectVersion = $pkg.version
              }
            } catch {
              Write-Warning "Erreur lecture package.json"
            }
          } elseif (Test-Path "./composer.json") {
            try {
              $composer = Get-Content -Raw -Path "./composer.json" | ConvertFrom-Json
              if (-not [string]::IsNullOrWhiteSpace($composer.version)) {
                $projectVersion = $composer.version
              }
            } catch {
              Write-Warning "Erreur lecture composer.json"
            }
          }

          Write-Host "Nom du projet : $projectName"
          Write-Host "Version projet : $projectVersion"

          "project_name=$projectName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "project_version=$projectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Générer le SBOM
        shell: powershell
        run: |
          Write-Host "Génération du SBOM..."

          if (Test-Path "./package.json") {
            Write-Host "Détection JS/TS : forçage du type 'js' pour ignorer Gradle/Android"
            cdxgen --spec-version 1.5 -t js -o bom.json
          } elseif (Test-Path "./composer.json") {
            Write-Host "Détection PHP : forçage du type 'php'"
            cdxgen --spec-version 1.5 -t php -o bom.json
          } else {
            cdxgen --spec-version 1.5 -o bom.json
          }

          if (-not (Test-Path "./bom.json")) {
            Write-Error "CRITICAL: bom.json n'a pas été généré."
            exit 1
          }

          $taille = (Get-Item "./bom.json").Length
          if ($taille -eq 0) {
            Write-Error "CRITICAL: bom.json est vide."
            exit 1
          }

          Write-Host "SBOM généré avec succès ($taille octets)."

      - name: Envoyer le SBOM à Dependency-Track
        shell: powershell
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_URL: ${{ vars.DTRACK_URL || 'http://localhost:8081' }}
          PROJECT_NAME: ${{ steps.project.outputs.project_name }}
          PROJECT_VERSION: ${{ steps.project.outputs.project_version }}
        run: |
          $bomBytes = [System.IO.File]::ReadAllBytes("./bom.json")
          $bomBase64 = [System.Convert]::ToBase64String($bomBytes)

          $payload = @{
            projectName    = $env:PROJECT_NAME
            projectVersion = $env:PROJECT_VERSION
            autoCreate     = $true
            bom            = $bomBase64
          } | ConvertTo-Json -Compress

          $headers = @{
            "X-Api-Key"    = $env:DTRACK_API_KEY
            "Content-Type" = "application/json"
          }

          try {
            $resp = Invoke-RestMethod -Uri "$env:DTRACK_URL/api/v1/bom" -Method Put -Headers $headers -Body $payload -ErrorAction Stop
            Write-Host "Succès D-Track ! Token d'ingestion : $($resp.token)"
          } catch {
            Write-Error "Erreur HTTP lors de l'envoi :"
            if ($_.Exception.Response) {
              $sr = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              Write-Error $sr.ReadToEnd()
            } else {
              Write-Error $_.Exception.Message
            }
            exit 1
          }
