- name: Générer le SBOM
        shell: powershell
        run: |
          Write-Host "Génération du SBOM..."
          
          # Si c'est un repo JS/TS, on peut spécifier -t js pour éviter que cdxgen tente Gradle/Android
          if (Test-Path "./package.json") {
            Write-Host "Projet JavaScript/TypeScript détecté. Cible: js"
            cdxgen -t js -o bom.json
          } elseif (Test-Path "./composer.json") {
            Write-Host "Projet PHP détecté. Cible: php"
            cdxgen -t php -o bom.json
          } else {
            cdxgen -o bom.json
          }

          if (-not (Test-Path "./bom.json") -or (Get-Item "./bom.json").Length -eq 0) {
            Write-Error "Le fichier bom.json est absent ou vide."
            exit 1
          }

          Write-Host "SBOM généré avec succès. Taille : $((Get-Item './bom.json').Length) octets."

      - name: Envoyer le SBOM à Dependency-Track
        shell: powershell
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_URL: ${{ vars.DTRACK_URL || 'http://localhost:8081' }}
          PROJECT_NAME: ${{ steps.project.outputs.project_name }}
          PROJECT_VERSION: ${{ steps.project.outputs.project_version }}
        run: |
          $bomBytes = [System.IO.File]::ReadAllBytes("./bom.json")
          $bomBase64 = [System.Convert]::ToBase64String($bomBytes)

          $body = @{
            projectName    = $env:PROJECT_NAME
            projectVersion = $env:PROJECT_VERSION
            autoCreate     = $true
            bom            = $bomBase64
          } | ConvertTo-Json -Compress

          $headers = @{
            "X-Api-Key"    = $env:DTRACK_API_KEY
            "Content-Type" = "application/json"
          }

          try {
            $response = Invoke-RestMethod `
              -Uri "$env:DTRACK_URL/api/v1/bom" `
              -Method Put `
              -Headers $headers `
              -Body $body `
              -ErrorAction Stop

            Write-Host "SBOM envoyé avec succès à Dependency-Track."
            Write-Host "Token : $($response.token)"
          }
          catch {
            Write-Error "Échec de l'envoi du SBOM à Dependency-Track."
            if ($_.Exception.Response) {
              $stream =$_.Exception.Response.GetResponseStream()
              $reader = New-Object System.IO.StreamReader($stream)
              $bodyResponse =$reader.ReadToEnd()
              Write-Error "Détail de l'erreur API : $bodyResponse"
            } else {
              Write-Error $_.Exception.Message
            }
            exit 1
          }
